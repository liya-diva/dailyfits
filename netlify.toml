[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# No redirects here on purpose. Each function declares its own path
# (/api/closet and /api/tag). Adding redirects to the default function URL
# competes with that and breaks routing.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
